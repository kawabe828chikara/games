<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME SELECT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#080818;
  min-height:100vh;
  font-family:'Meiryo','MS Gothic',sans-serif;
  color:#fff;
  overflow-x:hidden;
}
canvas#bg{position:fixed;top:0;left:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 20px}

h1{
  text-align:center;
  font-size:clamp(28px,6vw,48px);
  letter-spacing:6px;
  margin-bottom:8px;
  background:linear-gradient(90deg,#00d4ff,#a060ff,#ff3cc8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px #00d4ff88);
}
.sub{text-align:center;color:#666;font-size:13px;letter-spacing:3px;margin-bottom:50px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:24px;
}

.card{
  background:linear-gradient(145deg,#0d1a2e,#0a1020);
  border:1px solid #1a3060;
  border-radius:12px;
  padding:28px 24px;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  text-decoration:none;
  display:block;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(160,96,255,0.06));
  opacity:0;transition:opacity .2s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 8px 32px rgba(0,212,255,0.25);
  border-color:#00d4ff88;
}
.card:hover::before{opacity:1}

.card-badge{
  display:inline-block;
  font-size:10px;letter-spacing:2px;
  padding:3px 10px;border-radius:20px;
  margin-bottom:14px;
  background:rgba(0,212,255,0.15);
  border:1px solid rgba(0,212,255,0.4);
  color:#00d4ff;
}
.card-badge.new{
  background:rgba(255,60,200,0.15);
  border-color:rgba(255,60,200,0.4);
  color:#ff3cc8;
}

.card-icon{
  font-size:42px;
  margin-bottom:14px;
  display:block;
  filter:drop-shadow(0 0 8px #00d4ff66);
}

.card-title{
  font-size:20px;letter-spacing:2px;font-weight:bold;
  color:#e0f0ff;margin-bottom:8px;
}
.card-desc{
  font-size:12px;line-height:1.7;color:#6080a0;
}
.card-tags{
  margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;
}
.tag{
  font-size:10px;padding:2px 8px;border-radius:4px;
  background:rgba(255,255,255,0.06);color:#8090b0;
  border:1px solid rgba(255,255,255,0.08);
}

.card-play{
  position:absolute;bottom:20px;right:20px;
  font-size:11px;letter-spacing:2px;color:#00d4ff88;
  transition:color .2s;
}
.card:hover .card-play{color:#00d4ff;}

.coming{
  opacity:0.4;cursor:default;
  pointer-events:none;
}
.coming .card-badge{
  background:rgba(100,100,100,0.15);
  border-color:rgba(100,100,100,0.3);
  color:#666;
}

footer{
  text-align:center;margin-top:60px;
  font-size:11px;color:#2a3a4a;letter-spacing:2px;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <h1>◈ GAME SELECT ◈</h1>
  <p class="sub">kawabe828chikara's arcade</p>

  <div class="grid">

    <!-- シューター -->
    <a class="card" href="shooter.html">
      <span class="card-badge new">NEW</span>
      <span class="card-icon">🚀</span>
      <div class="card-title">VERTICAL SHOOTER</div>
      <div class="card-desc">
        縦スクロールシューティング。<br>
        特殊敵を倒してパワーアップ！<br>
        Wave途中でカニ出現。最後はボスを撃破せよ。
      </div>
      <div class="card-tags">
        <span class="tag">SHOOTER</span>
        <span class="tag">5 WAVES</span>
        <span class="tag">BOSS</span>
        <span class="tag">POWER UP</span>
      </div>
      <span class="card-play">▶ PLAY</span>
    </a>

    <!-- 準備中 1 -->
    <div class="card coming">
      <span class="card-badge">COMING SOON</span>
      <span class="card-icon">🎮</span>
      <div class="card-title">??? GAME</div>
      <div class="card-desc">
        次のゲームを準備中です。<br>
        お楽しみに。
      </div>
      <div class="card-tags">
        <span class="tag">???</span>
      </div>
    </div>

  </div>

  <footer>© kawabe828chikara — built with Claude Code</footer>
</div>

<script>
// 星空背景
const c=document.getElementById('bg');
const ctx=c.getContext('2d');
let W,H,stars=[];
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;stars=[...Array(180)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.3,sp:Math.random()*0.4+0.1,b:Math.floor(Math.random()*180+60)}))}
window.addEventListener('resize',resize);resize();
function loop(){
  ctx.fillStyle='rgba(8,8,24,0.25)';ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.fillStyle=`rgb(${s.b},${s.b},${s.b})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
    s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W;}
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
